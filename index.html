<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#e33f1a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="CrudoBeat" />
<title>CrudoBeat</title>
<style>
  :root{--bg:#f2e7d0;--bg2:#e9dbbd;--ink:#2b2118;--red:#e33f1a;--red2:#b62c10;--cream:#f7efdd;--panel-border:#c9b48a;--edge:52px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;width:100%;background:var(--bg);color:var(--ink);
    font-family:"Arial Rounded MT Bold",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;}
  #canvas{position:absolute;top:0;right:0;display:block;touch-action:none;}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:5px;
    padding:3px 8px;padding-top:calc(3px + env(safe-area-inset-top,0px));padding-right:var(--edge);
    background:var(--red);border-bottom:3px solid var(--red2);z-index:12;pointer-events:none;flex-wrap:wrap;box-shadow:0 2px 8px rgba(60,40,20,.25);}
  #topbar>*{pointer-events:auto;}
  .brandwrap{display:flex;align-items:center;gap:8px;margin-right:auto;}
  /* Stylophone-style speaker box (also acts as PAN handle) */
  .speaker{position:relative;width:130px;height:38px;border-radius:6px;background:#0c0c0e;border:2px solid #000;
    box-shadow:inset 0 0 6px rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.4);padding:4px;display:flex;align-items:center;overflow:hidden;flex:0 0 auto;touch-action:none;}
  .speaker.panning{outline:3px solid #fff;}
  .speaker .mesh{position:absolute;inset:4px;border-radius:3px;
    background-image:repeating-linear-gradient(90deg,#d9d9de 0 1px,#3a3a40 1px 4px),repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,rgba(0,0,0,.35) 1px 4px);
    background-blend-mode:overlay;box-shadow:inset 0 0 8px rgba(0,0,0,.7);}
  .speaker .plate{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:linear-gradient(180deg,#f4f4f0,#c9c9c2);
    border-radius:3px;padding:2px 6px;box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px #fff;font-family:"Brush Script MT","Segoe Script",cursive;
    font-style:italic;font-weight:800;font-size:12px;color:#16161a;white-space:nowrap;}
  .speaker .plate sup{font-size:7px;}

  .grp{display:flex;align-items:center;gap:2px;background:var(--cream);border:2px solid var(--red2);border-radius:8px;padding:2px;flex-wrap:wrap;box-shadow:0 2px 0 var(--red2);}
  .grp button{border:none;background:transparent;color:var(--ink);font-size:11px;font-weight:800;padding:5px 8px;border-radius:6px;cursor:pointer;transition:all .1s;}
  .grp button.active{background:var(--red);color:var(--cream);}
  select.sel{border:2px solid var(--red2);background:var(--cream);color:var(--ink);font-weight:800;font-size:11px;border-radius:7px;padding:5px 6px;box-shadow:0 2px 0 var(--red2);cursor:pointer;}

  #controls{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:5px;
    padding:6px var(--edge) calc(6px + env(safe-area-inset-bottom,0px)) 8px;background:var(--red);border-top:3px solid var(--red2);z-index:12;flex-wrap:wrap;box-shadow:0 -2px 8px rgba(60,40,20,.25);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:40px;height:40px;padding:0 10px;border-radius:10px;
    border:2px solid var(--red2);background:var(--cream);color:var(--ink);font-size:12px;font-weight:800;cursor:pointer;transition:transform .1s,background .15s;box-shadow:0 2px 0 var(--red2);}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red2);}
  .btn.icon{padding:0;width:42px;}
  .btn.on{background:var(--ink);color:var(--cream);border-color:#000;}
  .btn.rec.armed{background:#fff;color:var(--red);border-color:#fff;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7),0 2px 0 var(--red2)}50%{box-shadow:0 0 0 9px rgba(255,255,255,0),0 2px 0 var(--red2)}}
  .btn:disabled{opacity:.45;cursor:default;}

  #zoomctl{display:flex;gap:4px;align-items:center;background:var(--cream);border:2px solid var(--red2);border-radius:9px;padding:3px 4px;box-shadow:0 2px 0 var(--red2);}
  #zoomctl button{border:none;background:var(--red);color:var(--cream);font-size:11px;font-weight:900;padding:6px 8px;border-radius:7px;cursor:pointer;}

  #octave{display:flex;gap:4px;align-items:center;
    background:var(--cream);border:2px solid var(--red2);border-radius:9px;padding:3px 4px;box-shadow:0 2px 0 var(--red2);}
  #octave .oct{width:28px;height:28px;border-radius:7px;border:none;background:var(--red);color:var(--cream);font-size:15px;font-weight:900;cursor:pointer;}
  #octave .octlbl{font-size:9px;font-weight:800;min-width:38px;text-align:center;}

  #synthPanel{position:fixed;right:var(--edge);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:11;display:none;flex-direction:column;gap:5px;
    background:var(--cream);border:2px solid var(--red2);border-radius:9px;padding:8px;box-shadow:0 2px 0 var(--red2);width:200px;max-width:calc(100vw - 60px);}
  #synthPanel.show{display:flex;}
  #synthPanel .r{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;width:100%;}
  #synthPanel label{flex:0 0 42px;min-width:42px;}
  #synthPanel input[type=range]{flex:1 1 auto;min-width:0;width:100%;accent-color:var(--red);margin:0;}
  #synthPanel .waves{display:flex;gap:3px;width:100%;}
  #synthPanel .waves button{flex:1 1 0;min-width:0;border:2px solid var(--red2);background:var(--cream);color:var(--ink);border-radius:5px;padding:5px 0;font-size:10px;font-weight:800;cursor:pointer;}
  #synthPanel .waves button.active{background:var(--red);color:var(--cream);}

  #looper{position:fixed;left:0;top:calc(60px + env(safe-area-inset-top,0px));bottom:56px;width:0;overflow-y:auto;overflow-x:hidden;z-index:11;
    padding:6px;display:none;flex-direction:column;gap:6px;background:var(--bg2);border-right:3px solid var(--red2);}
  #looper.show{display:flex;}
  #looperHead{display:flex;flex-direction:column;gap:5px;position:sticky;top:0;z-index:2;background:var(--bg2);padding:calc(4px + env(safe-area-inset-top,0px)) 2px 6px;}
  #looperHead .titrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  #looperHead .t{font-size:12px;font-weight:900;color:var(--red2);margin-right:auto;}
  #looperHead .titrow button{border:2px solid var(--red2);background:var(--cream);color:var(--ink);border-radius:7px;width:30px;height:28px;cursor:pointer;font-size:13px;font-weight:800;}
  #looperHead .titrow #modeBtn{width:auto;padding:0 8px;font-size:11px;}
  #looperHead .titrow #modeBtn.on{background:var(--red);color:var(--cream);}
  #looperHead .latrow{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--ink);padding:0 2px;}
  #looperHead .latrow input[type=range]{flex:1;min-width:0;accent-color:var(--red);}
  #looperHead .playbar{position:relative;height:16px;border:2px solid var(--red2);border-radius:6px;background:#efe2c4;overflow:hidden;margin:2px 2px 0;}
  #looperHead .playfill{position:absolute;top:0;left:0;bottom:0;width:0;background:rgba(227,63,26,.45);}
  #looperHead .playlbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink);}
  .projname{font-size:11px;font-weight:800;color:var(--ink);opacity:.8;padding:0 2px;}
  .clip{background:var(--cream);border:2px solid var(--red2);border-radius:9px;padding:5px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 0 var(--red2);}
  .clip.sel{outline:2px solid var(--ink);}
  .clip.dragging{opacity:.85;box-shadow:0 6px 16px rgba(0,0,0,.4);position:relative;z-index:20;}
  .clip.muted{opacity:.5;}
  .clip .row{display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
  .clip .cname{font-size:11px;font-weight:900;margin-right:auto;background:transparent;border:none;color:inherit;min-width:60px;max-width:120px;}
  .clip .wavewrap{position:relative;overflow-x:auto;overflow-y:hidden;}
  .clip canvas{height:44px;display:block;border-radius:5px;background:#efe2c4;border:2px solid var(--panel-border);}
  .clip .handle{position:absolute;top:0;bottom:0;width:16px;background:rgba(227,63,26,.35);border:2px solid var(--red);cursor:ew-resize;display:none;z-index:3;}
  .clip.cutting .handle{display:block;}
  .clip .keepmask{position:absolute;top:0;bottom:0;background:rgba(43,33,24,0.35);display:none;pointer-events:none;z-index:2;}
  .clip.cutting .keepmask{display:block;}
  .clip button{border:2px solid var(--red2);background:var(--cream);color:var(--ink);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:800;}
  .clip button.act{background:var(--red);color:var(--cream);}
  .clip button:disabled{opacity:.4;cursor:default;}

  /* ---- Studio (BandLab-style timeline) ---- */
  #studio{display:none;flex:1;min-height:0;overflow:hidden;}
  #studio.show{display:block;}
  #studioScroll{width:100%;height:100%;overflow:auto;}
  #studioInner{position:relative;}
  #studioRuler{position:sticky;top:0;height:22px;background:var(--bg2);border-bottom:2px solid var(--red2);z-index:3;}
  #studioRuler .tick{position:absolute;top:0;bottom:0;border-left:1px solid rgba(43,33,24,.25);font-size:9px;color:rgba(43,33,24,.7);padding-left:2px;}
  #studioLanes{position:relative;}
  .lane{position:relative;height:60px;border-bottom:1px solid rgba(43,33,24,.15);}
  .lane .laneHead{position:sticky;left:0;z-index:2;width:96px;height:100%;float:left;background:var(--cream);border-right:2px solid var(--red2);display:flex;flex-direction:column;justify-content:center;gap:3px;padding:3px 5px;box-sizing:border-box;}
  .lane .laneHead .ln{font-size:10px;font-weight:900;overflow:hidden;white-space:nowrap;}
  .lane .laneHead .lb{display:flex;gap:3px;}
  .lane .laneHead button{border:2px solid var(--red2);background:var(--cream);color:var(--ink);border-radius:5px;width:24px;height:22px;font-size:10px;font-weight:800;cursor:pointer;}
  .lane .laneHead button.act{background:var(--red);color:var(--cream);}
  .block{position:absolute;top:4px;height:52px;background:rgba(227,63,26,.25);border:2px solid var(--red);border-radius:6px;overflow:hidden;cursor:grab;touch-action:none;}
  .block.sel{outline:2px solid var(--ink);z-index:2;}
  .block canvas{display:block;width:100%;height:100%;}
  .block .bn{position:absolute;top:1px;left:3px;font-size:9px;font-weight:800;color:var(--ink);pointer-events:none;}
  .block .loopbadge{position:absolute;bottom:1px;right:3px;font-size:9px;font-weight:800;color:var(--red2);pointer-events:none;}
  #playhead{position:absolute;top:0;bottom:0;width:2px;background:#111;z-index:4;pointer-events:none;left:96px;}

  /* persistent Tracce button bottom-left */
  #tracceBtn{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:14;
    border:2px solid #000;background:var(--ink);color:var(--cream);font-weight:900;font-size:12px;
    padding:9px 12px;border-radius:10px;cursor:pointer;box-shadow:0 2px 0 #000;}

  /* load dialog */
  #loadDlg{position:fixed;inset:0;background:rgba(20,14,8,.55);z-index:30;display:none;align-items:center;justify-content:center;}
  #loadDlg.show{display:flex;}
  #loadBox{background:var(--cream);border:3px solid var(--red2);border-radius:14px;padding:14px;width:min(90vw,360px);max-height:80vh;overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.4);}
  #loadBox h3{margin:0 0 10px;color:var(--red2);}
  #loadBox .prj{display:flex;align-items:center;gap:6px;border:2px solid var(--red2);border-radius:9px;padding:7px;margin-bottom:7px;background:#fff8ea;}
  #loadBox .prj .pn{flex:1;font-weight:800;font-size:13px;}
  #loadBox .prj button{border:2px solid var(--red2);background:var(--cream);border-radius:7px;height:30px;padding:0 8px;cursor:pointer;font-weight:800;font-size:12px;}
  #loadBox .close{width:100%;margin-top:6px;border:2px solid var(--red2);background:var(--red);color:var(--cream);border-radius:9px;height:36px;font-weight:800;cursor:pointer;}

  #hint{position:fixed;top:52%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--red2);font-size:13px;font-weight:700;pointer-events:none;z-index:5;line-height:1.5;padding:0 30px;transition:opacity .6s;max-width:320px;}
  #hint b{color:var(--red);}
  .fade{opacity:0!important;}

  #toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
    background:var(--ink);border:2px solid #000;color:var(--cream);padding:8px 14px;border-radius:11px;font-size:12px;font-weight:700;z-index:25;opacity:0;transition:all .3s;pointer-events:none;max-width:80vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* when multitrack expanded fullscreen, hide top & bottom bars for max editing space */
  body.looperFull #topbar,body.looperFull #controls,body.looperFull #octave,body.looperFull #synthPanel,body.looperFull #tracceBtn{display:none!important;}
  body.looperFull #looper{top:0!important;bottom:0!important;}

  .tools{display:flex;gap:3px;align-items:center;background:var(--cream);border:2px solid var(--red2);border-radius:8px;padding:2px;box-shadow:0 2px 0 var(--red2);}
  .tools button{border:none;background:transparent;color:var(--ink);font-size:13px;height:32px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;}
  .tools button.iconbtn{width:32px;}
  .tools button.live{width:auto;padding:0 12px;font-size:11px;font-weight:900;letter-spacing:.5px;}
  .tools button.active{background:var(--red);color:var(--cream);}
  .tools button.live.active{background:var(--ink);color:var(--cream);}

  @media (max-height:480px){
    .speaker{width:110px;height:32px;}
    .btn{height:36px;font-size:11px;padding:0 8px;min-width:36px;}.btn.icon{width:38px;}
    .grp button,.tools button{padding:4px 6px;font-size:10px;height:30px;}
    #octave .oct{width:28px;height:26px;}#looper{top:calc(56px + env(safe-area-inset-top,0px));bottom:52px;}
    #tracceBtn{bottom:calc(6px + env(safe-area-inset-bottom,0px));padding:7px 10px;font-size:11px;}
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="topbar">
  <div class="brandwrap">
    <div class="speaker" id="speaker" title="Tieni premuto e scorri con l'altro dito per spostare la vista"><div class="mesh"></div><div class="plate">CrudoBeat<sup>®</sup></div></div>
  </div>
  <div class="tools" id="tools">
    <button data-tool="live" class="live active" title="Live">LIVE</button>
    <button data-tool="note" class="iconbtn" title="Nota">●</button>
    <button data-tool="pulsar" class="iconbtn" title="Pulsar">◎</button>
    <button data-tool="erase" class="iconbtn" title="Cancella">✕</button>
    <button data-tool="grid" class="iconbtn" title="Griglia">▦</button>
  </div>
  <div class="grp" id="instrSwitch">
    <button data-instr="node">Node</button>
    <button data-instr="bass">Bass</button>
    <button data-instr="drums">Drums</button>
    <button data-instr="ambient">Amb</button>
    <button data-instr="synth">Syn</button>
  </div>
  <select class="sel" id="keySel" title="Tonalità"></select>
  <select class="sel" id="scaleSel" title="Scala"></select>
  <div id="octave">
    <button class="oct" id="octDown">－</button>
    <div class="octlbl" id="octLbl">8va 0</div>
    <button class="oct" id="octUp">＋</button>
  </div>
  <div id="zoomctl">
    <button id="gzOut" title="Zoom −">🔍－</button>
    <button id="gzIn" title="Zoom +">🔍＋</button>
  </div>
</div>

<div id="looper">
  <div id="looperHead">
    <div class="titrow"><span class="t">🎛 MULTITRACCIA</span><button id="allPlayBtn" title="Play tutte">▶</button><button id="allPauseBtn" title="Pausa tutte">⏸</button><button id="allStopBtn" title="Stop (torna a inizio)">⏹</button><button id="viewBtn" title="Vista: Verticale o Studio (timeline)">Vert</button><button id="modeBtn" title="Modalità: Libera o Loop 8 battute">Libera</button><button id="lpZoomOut" title="Zoom −">🔍－</button><button id="lpZoomIn" title="Zoom +">🔍＋</button><button id="saveBtn" title="Salva progetto">💾</button><button id="loadBtn" title="Carica progetto">📂</button><button id="exportAllBtn" title="Esporta tutte le tracce (esclude le mute)">⤓</button><button id="expandBtn" title="Espandi / metà">⤢</button><button id="closeLooper" title="Chiudi">✕</button></div>
    <div class="projname" id="projName">Progetto: (nuovo)</div>
    <div class="latrow" id="latRow"><span>Latenza</span><input type="range" id="latSlider" min="0" max="300" value="120"><span id="latVal">120ms</span></div>
    <div class="playbar" id="playbar"><div class="playfill" id="playfill"></div><div class="playlbl" id="playlbl"></div></div>
  </div>
  <div id="clipList"></div>
  <div id="studio"><div id="studioScroll"><div id="studioInner"><div id="studioRuler"></div><div id="studioLanes"></div><div id="playhead"></div></div></div></div>
</div>

<button id="tracceBtn" title="Apri multitraccia">🎛 Tracce</button>

<div id="synthPanel">
  <div class="waves" id="synthWaves">
    <button data-w="sawtooth" class="active">Saw</button>
    <button data-w="square">Squa</button>
    <button data-w="triangle">Tri</button>
    <button data-w="sine">Sine</button>
  </div>
  <div class="r"><label>Cutoff</label><input type="range" id="synthCut" min="200" max="8000" value="1600"></div>
  <div class="r"><label>Reso</label><input type="range" id="synthReso" min="1" max="24" value="10"></div>
  <div class="r"><label>Drive</label><input type="range" id="synthDrive" min="0" max="80" value="35"></div>
</div>

<div id="hint">
  <b>LIVE</b>: suona col dito (multitouch), tieni premuto e scorri per lo <b>slide</b>.<br>
  <b>● REC</b> registra • <b>🎤</b> microfono • <b>🎛 Tracce</b> apre il multitraccia
</div>

<div id="toast"></div>

<div id="loadDlg"><div id="loadBox"><h3>📂 Carica progetto</h3><div id="prjList"></div><button class="close" id="loadClose">Chiudi</button></div></div>

<div id="controls">
  <button class="btn icon" id="playBtn" title="Play/Pausa">▶</button>
  <button class="btn icon" id="metroBtn" title="Metronomo">🎚</button>
  <button class="btn" id="delayBtn" title="Delay">Delay: off</button>
  <button class="btn" id="reverbBtn" title="Riverbero">Riv: off</button>
  <button class="btn icon" id="tempoBtn" title="Tempo">♩100</button>
  <button class="btn icon" id="clearBtn" title="Svuota nodi">🗑</button>
  <button class="btn rec" id="recBtn" title="Registra">● REC</button>
  <button class="btn icon" id="micBtn" title="Microfono">🎤</button>
  <select class="sel" id="micSel" title="Microfono di ingresso"><option value="">Mic: predefinito</option></select>
</div>

<script>
"use strict";
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
(function () {
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  const looperEl=document.getElementById('looper');
  const tracceBtn=document.getElementById('tracceBtn');
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  let splitMode=false,looperFull=false,looperHidden=true,CANVAS_LEFT=0,CANVAS_W=0;

  function applyLayout(){
    tracceBtn.style.display=(splitMode&&!looperHidden&&!looperFull)?'none':'block';
    document.body.classList.toggle('looperFull',splitMode&&!looperHidden&&looperFull);
    // measure real topbar height so looper header (commands) is never covered
    const tb=document.getElementById('topbar');const topH=(document.body.classList.contains('looperFull')?0:((tb&&tb.offsetHeight)||60)+4);
    if(!document.body.classList.contains('looperFull'))looperEl.style.top=topH+'px';else looperEl.style.top='0px';
    if(looperHidden||!splitMode){looperEl.classList.remove('show');looperEl.style.width='0';CANVAS_LEFT=0;CANVAS_W=window.innerWidth;canvas.style.display='block';}
    else if(looperFull){looperEl.classList.add('show');looperEl.style.width='100vw';CANVAS_W=0;canvas.style.display='none';}
    else{const half=Math.round(window.innerWidth*0.5);looperEl.classList.add('show');looperEl.style.width=half+'px';CANVAS_LEFT=half;CANVAS_W=window.innerWidth-half;canvas.style.display='block';}

  }

  // ---- Export all (skip muted) — with per-clip FX ----
  async function exportAll(){const active=clips.filter(c=>!c.muted);if(!active.length){toast('Nessuna traccia da esportare (tutte mute?)');return;}

  // ---- Long-press drag & drop to reorder clips vertically ----
  let dragState=null;
  function enableClipDrag(el,idx){
    let pressTimer=null,started=false,startY=0;
    const begin=(clientY)=>{started=true;el.classList.add('dragging');dragState={idx,el};document.body.style.overflow='hidden';toast('Trascina per riordinare');};
    const onDown=(clientY)=>{startY=clientY;pressTimer=setTimeout(()=>begin(clientY),400);};
    const onMove=(clientY)=>{
      if(!started){if(Math.abs(clientY-startY)>12){clearTimeout(pressTimer);}return;}
      el.style.transform='translateY('+(clientY-startY)+'px)';el.style.opacity='.85';
    };
    const onUp=(clientY)=>{clearTimeout(pressTimer);
      if(started&&dragState){
        const items=[...clipList.children];let target=items.length-1;
        for(let i=0;i<items.length;i++){const r=items[i].getBoundingClientRect();if(clientY<r.top+r.height/2){target=i;break;}}
        const from=dragState.idx;if(target!==from&&target>=0&&target<clips.length){const moved=clips.splice(from,1)[0];clips.splice(target,0,moved);selectedClip=target;buildClipList();toast('Traccia spostata');}
        else buildClipList();
      }
      started=false;dragState=null;el.classList.remove('dragging');document.body.style.overflow='';
    };
    el.addEventListener('touchstart',(e)=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT'||e.target.tagName==='CANVAS'||e.target.classList.contains('handle'))return;onDown(e.touches[0].clientY);},{passive:true});
    el.addEventListener('touchmove',(e)=>{if(started)e.preventDefault();onMove(e.touches[0].clientY);},{passive:false});
    el.addEventListener('touchend',(e)=>{onUp((e.changedTouches[0]||{}).clientY||0);});
    // mouse (desktop): long-press too
    el.addEventListener('mousedown',(e)=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT'||e.target.tagName==='CANVAS'||e.target.classList.contains('handle'))return;onDown(e.clientY);
      const mm=(ev)=>onMove(ev.clientY);const mu=(ev)=>{onUp(ev.clientY);window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
      window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);});
  }

  // ---------- Microphone ----------

  const micSel=document.getElementById('micSel');let selectedMicId='';
  async function refreshMicList(){try{const devs=await navigator.mediaDevices.enumerateDevices();const mics=devs.filter(d=>d.kind==='audioinput');
    micSel.innerHTML='<option value="">🎤 Mic: predefinito</option>';mics.forEach((m,i)=>{const o=document.createElement('option');o.value=m.deviceId;o.textContent='🎤 '+(m.label||('Microfono '+(i+1)));if(m.deviceId===selectedMicId)o.selected=true;micSel.appendChild(o);});}catch(e){}}
  micSel.addEventListener('change',()=>{selectedMicId=micSel.value;toast('Mic: '+(micSel.options[micSel.selectedIndex].textContent));});
  async function startMic(){resumeAudio();
    if(!window.isSecureContext){toast('Microfono: serve HTTPS (contesto sicuro)');return;}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Microfono non supportato dal browser');return;}
    // try selected device with exact; on failure, retry without device constraint, then simplest form
    let stream=null;const base={echoCancellation:false,noiseSuppression:false,autoGainControl:false};
    const attempts=[];
    if(selectedMicId)attempts.push({audio:Object.assign({deviceId:{exact:selectedMicId}},base)});
    attempts.push({audio:base});
    attempts.push({audio:true});
    let lastErr=null;
    for(const con of attempts){try{stream=await navigator.mediaDevices.getUserMedia(con);break;}catch(e){lastErr=e;}}
    if(!stream){const n=lastErr&&lastErr.name;
      let msg='Microfono: errore';
      if(n==='NotAllowedError'||n==='SecurityError')msg='Microfono: permesso negato. Consenti l\'accesso nel browser';
      else if(n==='NotFoundError'||n==='OverconstrainedError')msg='Microfono: nessun dispositivo trovato';
      else if(n==='NotReadableError')msg='Microfono occupato da un\'altra app';
      else if(lastErr)msg='Microfono: '+(lastErr.message||n);
      toast(msg);return;}
    micStream=stream;
    refreshMicList(); // labels become available only after permission granted
    micNode=audio.createMediaStreamSource(micStream);const proc=audio.createScriptProcessor(2048,2,2);const L=[],R=[];
    micNode.connect(proc);const silent=audio.createGain();silent.gain.value=0;proc.connect(silent);silent.connect(audio.destination);
    proc.onaudioprocess=(ev)=>{L.push(new Float32Array(ev.inputBuffer.getChannelData(0)));R.push(new Float32Array(ev.inputBuffer.getChannelData(ev.inputBuffer.numberOfChannels>1?1:0)));};
    micCapture={proc,L,R,silent};micRecording=true;micBtn.classList.add('on');micBtn.textContent='■';toast('Microfono: registro SOLO il mic (no altre tracce)');}
  function stopMic(){if(!micCapture)return;const{proc,L,R,silent}=micCapture;proc.disconnect();silent.disconnect();try{micNode.disconnect();}catch(e){}proc.onaudioprocess=null;
    if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}micNode=null;let len=0;for(const b of L)len+=b.length;const buf=audio.createBuffer(2,Math.max(1,len),audio.sampleRate);const cl=buf.getChannelData(0),cr=buf.getChannelData(1);
    let o=0;for(let i=0;i<L.length;i++){cl.set(L[i],o);cr.set(R[i],o);o+=L[i].length;}micCapture=null;micRecording=false;micBtn.classList.remove('on');micBtn.textContent='🎤';if(buf.length>1000)addClip(buf,'Mic '+(clipCounter+1));else toast('Reg. mic troppo breve');}
  micBtn.addEventListener('click',()=>{if(!micRecording)startMic();else stopMic();});
  // populate mic list on load + when devices change (USB-C hub plugged/unplugged)
  if(navigator.mediaDevices){refreshMicList();navigator.mediaDevices.addEventListener&&navigator.mediaDevices.addEventListener('devicechange',refreshMicList);}

  // ---------- Projects: Save / Load (features 8,9,10) ----------
  // ---------- Projects: IndexedDB (large capacity, stores Blob WAV directly) ----------
  const DB_NAME='crudobeat',DB_STORE='projects';let _db=null;
  function openDB(){return new Promise((res,rej)=>{if(_db)return res(_db);const rq=indexedDB.open(DB_NAME,1);
    rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'name'});};
    rq.onsuccess=()=>{_db=rq.result;res(_db);};rq.onerror=()=>rej(rq.error);});}
  async function dbPut(rec){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
  async function dbGet(name){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const rq=tx.objectStore(DB_STORE).get(name);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
  async function dbDel(name){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(name);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
  async function dbAll(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(DB_STORE,'readonly');const rq=tx.objectStore(DB_STORE).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);});}
  async function storageInfo(){try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();const mb=(n)=>Math.round(n/1048576);return ' • '+mb(e.usage)+'/'+mb(e.quota)+' MB usati';}}catch(e){}return '';}

  async function saveProject(){resumeAudio();
    let name=currentProject.name;let count=0;try{count=(await dbAll()).length;}catch(e){}
    name=prompt('Nome del progetto:',name||('Progetto '+(count+1)));if(!name)return;
    toast('Salvataggio…');
    // store clips as binary WAV Blobs (no base64 bloat)
    const clipData=clips.map(c=>({name:c.name,muted:c.muted,color:c.color,fxRev:c.fxRev||0,fxDelay:c.fxDelay||0,t:c.t||0,wav:bufferToWav(c.buffer)}));
    try{await dbPut({name,ts:Date.now(),clips:clipData});currentProject.name=name;refreshProjName();
      toast('Progetto "'+name+'" salvato ('+clipData.length+' tracce)'+await storageInfo());}
    catch(e){toast('Salvataggio fallito: '+(e&&e.name==='QuotaExceededError'?'quota dispositivo piena':e.message));}
  }
  async function loadProject(name){let p;try{p=await dbGet(name);}catch(e){}if(!p)return;
    for(const c of clips)stopClipPlayback(c);clips.length=0;clipCounter=0;
    for(const cd of p.clips){try{const ab=await cd.wav.arrayBuffer();const buf=await audio.decodeAudioData(ab);clipCounter++;
      const clip={buffer:buf,name:cd.name,muted:cd.muted,paused:false,offset:0,source:null,gain:null,color:cd.color||TRACK_COLORS[(clipCounter-1)%NUM_TRACKS],history:[],redo:[],fadeIn:0,fadeOut:0,fxRev:cd.fxRev||0,fxDelay:cd.fxDelay||0,t:cd.t||0,_tlScheduled:false};clips.push(clip);startClipPlayback(clip);}catch(e){}}
    currentProject.name=name;refreshProjName();splitMode=true;looperHidden=false;applyLayout();refreshView();closeLoad();toast('Progetto "'+name+'" caricato');}
  function newProject(){for(const c of clips)stopClipPlayback(c);clips.length=0;clipCounter=0;loopStart=null;currentProject.name=null;refreshProjName();refreshView();}

  document.getElementById('saveBtn').addEventListener('click',saveProject);
  const loadDlg=document.getElementById('loadDlg'),prjList=document.getElementById('prjList');
  async function openLoad(){let all=[];try{all=await dbAll();}catch(e){}all.sort((a,b)=>b.ts-a.ts);prjList.innerHTML='';
    if(!all.length)prjList.innerHTML='<div style="opacity:.6">Nessun progetto salvato.</div>';
    all.forEach(p=>{const n=p.name;const row=document.createElement('div');row.className='prj';const pn=document.createElement('span');pn.className='pn';pn.textContent=n+' ('+p.clips.length+' tr.)';row.appendChild(pn);
      const open=document.createElement('button');open.textContent='Apri';open.onclick=()=>loadProject(n);row.appendChild(open);
      const ren=document.createElement('button');ren.textContent='✎';ren.title='Rinomina';ren.onclick=async()=>{const nn=prompt('Nuovo nome:',n);if(nn&&nn!==n){const rec=await dbGet(n);rec.name=nn;await dbPut(rec);await dbDel(n);if(currentProject.name===n){currentProject.name=nn;refreshProjName();}openLoad();}};row.appendChild(ren);
      const del=document.createElement('button');del.textContent='🗑';del.onclick=async()=>{if(confirm('Eliminare "'+n+'"?')){await dbDel(n);openLoad();}};row.appendChild(del);
      prjList.appendChild(row);});
    storageInfo().then(s=>{if(s){const info=document.createElement('div');info.style.cssText='opacity:.6;font-size:11px;margin-top:6px';info.textContent='Spazio'+s;prjList.appendChild(info);}});
    loadDlg.classList.add('show');}
  function closeLoad(){loadDlg.classList.remove('show');}
  document.getElementById('loadBtn').addEventListener('click',openLoad);
  document.getElementById('loadClose').addEventListener('click',closeLoad);
  loadDlg.addEventListener('click',(e)=>{if(e.target===loadDlg)closeLoad();});

  const toastEl=document.getElementById('toast');let toastTimer=null;function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200);}
  window.addEventListener('resize',()=>{applyLayout();if(splitMode&&!looperHidden)buildClipList();});
  window.addEventListener('orientationchange',()=>setTimeout(()=>{applyLayout();if(splitMode&&!looperHidden)buildClipList();},200));
  // start on a fresh project (feature 10)
  newProject();applyLayout();
})();
</script>
